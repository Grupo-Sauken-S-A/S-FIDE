name: Compilar y verificar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar JDK 23
        uses: actions/setup-java@v6
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar el reactor completo
        run: ./mvnw --batch-mode clean install
