# Ejemplo de valores por defecto para S-FiDE GUI.
#
# Para usarlo: copie este archivo como "sfide-defaults.properties" (mismo
# nombre exacto, sin ".demo") en la misma carpeta donde está SFide-GUI.jar, y
# descomente/edite las líneas que le interesen. Ese archivo se actualiza solo
# a medida que usa la GUI (no hace falta editarlo a mano salvo que quiera
# precargar un valor antes del primer uso) — ver Leeme.txt y la sección
# "Preguntas Frecuentes" de la ventana de Ayuda para el detalle completo de
# qué se recuerda entre sesiones.
#
# Las rutas de Windows pueden escribirse con "/" o con "\\" (barra doble,
# porque "\" es carácter de escape en un archivo .properties) — ambas formas
# funcionan igual.
#
# IMPORTANTE: nunca se guarda ninguna contraseña en este archivo. Los campos
# de contraseña de la GUI siempre arrancan vacíos.


# --- PKCS#11 (tokens criptográficos) --------------------------------------
# Ruta de la biblioteca PKCS#11 y número de slot, usados por defecto en
# TokenSlotsView, TokenCertificateExtractor, XMLSignerPKCS11 y
# PDFSignerPKCS11. Se recomienda usar el botón "Detectar automáticamente" de
# la GUI en vez de escribirlos a mano, salvo que ya sepa la ruta exacta.

pkcs11.library.path=C\:/Windows/System32/eTPKCS11.dll
pkcs11.slot.number=0

# Rutas típicas por marca/modelo, según shared-resources/token-profiles.txt
# (fuente única de verdad de este catálogo, actualizada con hardware real):
#   SafeNet/Thales eToken 5110+ :  C\:/Windows/System32/eTPKCS11.dll
#   Feitian ePass2003           :  C\:/Windows/System32/eps2003csp11.dll
#   mToken CryptoID (nueva, FIPS 140-3) :  C\:/Windows/System32/lm_cryptoide_pkcs11.dll

# Además de la ruta "global" de arriba, la GUI recuerda una ruta particular
# por cada marca/modelo elegida en el selector "Marca/modelo de token...",
# con esta clave (una por perfil, el nombre del perfil es el que aparece en
# el selector):
#pkcs11.library.path.profile.SafeNet/Thales eToken 5110 / 5110+=C\:/Windows/System32/eTPKCS11.dll
#pkcs11.library.path.profile.Feitian ePass2003 / ePass2003Auto=C\:/Windows/System32/eps2003csp11.dll


# --- PKCS#12 (certificado en archivo) --------------------------------------
# Usado por defecto en PKCS12CertificateExtractor, XMLSignerPKCS12 y
# PDFSignerPKCS12. El archivo de prueba del repositorio (no usar en
# producción) es un buen ejemplo de formato de ruta:

pkcs12.file.path=C\:/S-FiDE/test/test-sauken.pfx


# --- Almacén de certificados de Windows (CSP/KSP, solo Windows) -----------
# Alias exacto, o fragmento del nombre (CN), del certificado a usar en
# XMLSignerWindowsCSP/PDFSignerWindowsCSP — compartido y sincronizado en
# vivo entre esas dos pestañas. Si no sabe cuál escribir, use primero
# WindowsCertificateStoreView (pestaña "Ver Certificados de Windows") para
# ver qué hay disponible.

#windows.cert.alias=Juan Carlos Ríos


# --- Firma de PDF (posición y bloqueo) --------------------------------------
# Posición X/Y de la firma visible (en puntos PDF, origen inferior
# izquierdo — ver sección 7 del manual técnico) y si bloquear el documento
# después de firmar. Compartidos entre PDFSignerPKCS11/PKCS12/WindowsCSP.

#signature.x=40
#signature.y=55
#lock.document=false


# --- Preferencias de la ventana e interfaz ----------------------------------
# Estos valores los administra la propia GUI (se guardan solos al mover/
# redimensionar la ventana, o al cambiar de módulo) — normalmente no hace
# falta tocarlos a mano. Se documentan acá solo por completitud.

#last.module=Ver Slots de Token
#window.x=100
#window.y=100
#window.width=1200
#window.height=800
#window.maximized=true

# (Windows) La primera vez que se ejecuta SFide-GUI.bat en una instalación,
# se crean accesos directos en el escritorio y el menú inicio con el ícono
# de S-FiDE. Esto queda registrado acá para no repetirse en próximas
# ejecuciones. Para una instalación que se distribuye ya "usada" (por
# ejemplo, una imagen maestra) y no se quiere que cada usuario reciba sus
# propios accesos directos al primer uso, puede precargar este valor en
# "true" antes de distribuirla:
#desktop.shortcut.created=false
