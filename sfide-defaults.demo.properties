# Ejemplo de valores por defecto para S-FiDE GUI.
#
# Para usarlo: copie este archivo como "sfide-defaults.properties" (mismo
# nombre exacto, sin ".demo") en la carpeta PERSONAL de S-FiDE de su usuario
# (desde la versión 1.4.0, NO junto a SFide-GUI.jar):
#   Windows:      C:\Users\<su usuario>\S-FiDE\
#   Linux/macOS:  ~/S-FiDE/
# y descomente/edite las líneas que le interesen. Cada usuario del equipo
# tiene su propio archivo. Ese archivo se actualiza solo a medida que usa la
# GUI (no hace falta editarlo a mano salvo que quiera precargar un valor antes
# del primer uso) — ver Leeme.txt y la sección "Preguntas Frecuentes" de la
# ventana de Ayuda para el detalle completo de qué se recuerda entre sesiones.
#
# Las rutas de Windows pueden escribirse con "/" o con "\\" (barra doble,
# porque "\" es carácter de escape en un archivo .properties) — ambas formas
# funcionan igual.
#
# IMPORTANTE: nunca se guarda ninguna contraseña en este archivo. Los campos
# de contraseña de la GUI siempre arrancan vacíos (durante una sesión, la GUI
# puede reutilizar en memoria una contraseña que ya funcionó, pero eso nunca
# llega a este archivo).
#
# VERSIÓN DEL FORMATO: el archivo real lleva dos claves de control que escribe
# la propia GUI y que no conviene editar:
#   config.schema  número de versión del FORMATO del archivo. Si S-FiDE lo
#                  encuentra más viejo que el que entiende, lo adapta solo al
#                  abrir (por eso una actualización de S-FiDE nunca rompe los
#                  valores recordados).
#   app.version    versión de S-FiDE que lo escribió por última vez
#                  (informativa).
# Un archivo SIN estas claves (como este ejemplo, o uno de S-FiDE 1.3.0 o
# anterior) se interpreta como formato antiguo y se adapta automáticamente.


# --- PKCS#11 (tokens criptográficos) --------------------------------------
# Ruta de la biblioteca PKCS#11 y número de slot, usados por defecto en
# TokenSlotsView, TokenCertificateExtractor, XMLSignerPKCS11 y
# PDFSignerPKCS11. Se recomienda usar el botón "Detectar automáticamente" de
# la GUI en vez de escribirlos a mano, salvo que ya sepa la ruta exacta.
# El número de slot es solo el punto de partida: si en ese slot no hay un
# token, S-FiDE lo busca en los demás (ver "Preguntas Frecuentes").

pkcs11.library.path=C\:/Windows/System32/eTPKCS11.dll
pkcs11.slot.number=0

# Rutas típicas por marca/modelo, según shared-resources/token-profiles.txt
# (fuente única de verdad de este catálogo, actualizada con hardware real):
#   SafeNet/Thales eToken 5110+ :  C\:/Windows/System32/eTPKCS11.dll
#   Feitian ePass2003           :  C\:/Windows/System32/eps2003csp11.dll
#   mToken CryptoID (nueva, FIPS 140-3) :  C\:/Windows/System32/lm_cryptoide_pkcs11.dll

# Además de la ruta "global" de arriba, la GUI recuerda una ruta particular
# por cada marca/modelo elegida en el selector "Marca/modelo de token...",
# con esta clave (una por perfil, el nombre del perfil es el que aparece en
# el selector):
#pkcs11.library.path.profile.SafeNet/Thales eToken 5110 / 5110+=C\:/Windows/System32/eTPKCS11.dll
#pkcs11.library.path.profile.Feitian ePass2003 / ePass2003Auto=C\:/Windows/System32/eps2003csp11.dll


# --- PKCS#12 (certificado en archivo) --------------------------------------
# Usado por defecto en PKCS12CertificateExtractor, XMLSignerPKCS12 y
# PDFSignerPKCS12. El archivo de prueba del repositorio (no usar en
# producción) es un buen ejemplo de formato de ruta:

pkcs12.file.path=C\:/S-FiDE/test/test-sauken.pfx


# --- Almacén de certificados de Windows (CSP/KSP, solo Windows) -----------
# Alias exacto, o fragmento del nombre (CN), del certificado a usar en
# XMLSignerWindowsCSP/PDFSignerWindowsCSP — compartido y sincronizado en
# vivo entre esas dos pestañas. Si no sabe cuál escribir, use primero
# WindowsCertificateStoreView (pestaña "Ver Certificados de Windows") para
# ver qué hay disponible.

#windows.cert.alias=Juan Carlos Ríos


# --- Verificación de firmas -------------------------------------------------
# "Salida simple" en XMLVerifySignatures/PDFVerifySignatures (tildado por
# defecto). A diferencia de la posición de firma o el bloqueo de documento
# (ver más abajo), esta sí se recuerda entre sesiones: es una preferencia de
# cómo mostrar el resultado, no un dato de una operación puntual.

#simple.output=true


# --- Firma de PDF (posición y bloqueo) --------------------------------------
# La ubicación de la firma visible y las casillas "Cerrar el documento" y
# "Proteger el contenido" NO se guardan en este archivo: la ubicación se
# mantiene mientras la aplicación está abierta, y las casillas se destildan
# solas después de cada firma (a propósito, para no cerrar un documento sin
# querer). No hay clave de este archivo para precargarlas.
#
# --- Control interno (desde 1.5.0) -------------------------------------------
# "novedades.vistas" la escribe S-FiDE sola: es la última versión cuyas
# novedades ya se le mostraron a este usuario. No hace falta editarla; si se
# borra, la próxima vez se muestra el resumen de novedades de nuevo.


# --- Últimas carpetas usadas (desde 1.4.0) -----------------------------------
# La GUI recuerda la última carpeta de la que tomó un documento XML, PDF o XSD
# (por "Examinar...", o al pegar/escribir la ruta de un archivo existente), y
# la usa como carpeta inicial en "Examinar..." de todas las pestañas del mismo
# tipo de documento. Se guardan solas; si la carpeta ya no existe, se ignora.
# Puede precargarlas si siempre trabaja en el mismo lugar:

#last.dir.xml=C\:/Documentos/XML
#last.dir.pdf=C\:/Documentos/PDF
#last.dir.xsd=C\:/Esquemas


# --- Preferencias de la ventana e interfaz ----------------------------------
# Estos valores los administra la propia GUI (se guardan solos al mover/
# redimensionar la ventana, o al cambiar de módulo) — normalmente no hace
# falta tocarlos a mano. Se documentan acá solo por completitud.

#last.module=Ver Slots de Token
#window.x=100
#window.y=100
#window.width=1200
#window.height=800
#window.maximized=true

# (Windows) La primera vez que se ejecuta SFide-GUI.bat en una instalación,
# se crean accesos directos en el escritorio y el menú inicio con el ícono
# de S-FiDE: uno a la aplicación (desktop.shortcut.created) y otros dos a
# los documentos de "doc" — Guía de Usuario y Manual Técnico — que abren en
# el navegador (doc.shortcuts.created). Ambos quedan registrados acá para
# no repetirse en próximas ejecuciones, cada uno de forma independiente.
# Para una instalación que se distribuye ya "usada" (por ejemplo, una
# imagen maestra) y no se quiere que cada usuario reciba sus propios
# accesos directos al primer uso, puede precargar ambos valores en "true"
# antes de distribuirla:
#desktop.shortcut.created=false
#doc.shortcuts.created=false
